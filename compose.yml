services:
  api:
    build: .
    container_name: g1-bobby-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/apps/api:/app/packages/contracts:/app/packages/safety:/app/packages/robot_adapters
    ports:
      - "${G1_BOBBY_API_PORT:-8010}:8000"
    volumes:
      - .:/app
    command: uvicorn g1_bobby_api.app:app --host 0.0.0.0 --port 8000 --reload
